resourceMetrics:
  - resource:
      attributes:
        - key: server.port
          value:
            stringValue: "8888"
        - key: service.instance.id
          value:
            stringValue: 0.0.0.0:8888
        - key: service.name
          value:
            stringValue: otel-collector
        - key: service_instance_id
          value:
            stringValue: 4932bd21-5048-41c7-8bc2-be72983842ad
        - key: service_name
          value:
            stringValue: otelcontribcol
        - key: service_version
          value:
            stringValue: 0.148.0-dev
        - key: url.scheme
          value:
            stringValue: http
    scopeMetrics:
      - metrics:
          - description: The scraping was successful
            gauge:
              dataPoints:
                - asDouble: 1
                  timeUnixNano: "1000000"
            metadata:
              - key: prometheus.type
                value:
                  stringValue: gauge
            name: up
          - description: The number of samples remaining after metric relabeling was applied
            gauge:
              dataPoints:
                - asDouble: 9
                  timeUnixNano: "1000000"
            metadata:
              - key: prometheus.type
                value:
                  stringValue: gauge
            name: scrape_samples_post_metric_relabeling
          - description: Total CPU user and system time in seconds [Alpha]
            metadata:
              - key: prometheus.type
                value:
                  stringValue: counter
            name: otelcol_process_cpu_seconds
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asDouble: 0.73
                  attributes:
                    - key: service_instance_id
                      value:
                        stringValue: 4932bd21-5048-41c7-8bc2-be72983842ad
                    - key: service_name
                      value:
                        stringValue: otelcontribcol
                    - key: service_version
                      value:
                        stringValue: 0.148.0-dev
                  timeUnixNano: "1000000"
              isMonotonic: true
          - description: Uptime of the process [Alpha]
            metadata:
              - key: prometheus.type
                value:
                  stringValue: counter
            name: otelcol_process_uptime
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asDouble: 6.712940837
                  attributes:
                    - key: service_instance_id
                      value:
                        stringValue: 4932bd21-5048-41c7-8bc2-be72983842ad
                    - key: service_name
                      value:
                        stringValue: otelcontribcol
                    - key: service_version
                      value:
                        stringValue: 0.148.0-dev
                  timeUnixNano: "1000000"
              isMonotonic: true
          - description: Duration of the scrape
            gauge:
              dataPoints:
                - asDouble: 0.003702458
                  timeUnixNano: "1000000"
            metadata:
              - key: prometheus.type
                value:
                  stringValue: gauge
            name: scrape_duration_seconds
            unit: s
          - description: The number of samples the target exposed
            gauge:
              dataPoints:
                - asDouble: 9
                  timeUnixNano: "1000000"
            metadata:
              - key: prometheus.type
                value:
                  stringValue: gauge
            name: scrape_samples_scraped
          - description: The approximate number of new series in this scrape
            gauge:
              dataPoints:
                - asDouble: 9
                  timeUnixNano: "1000000"
            metadata:
              - key: prometheus.type
                value:
                  stringValue: gauge
            name: scrape_series_added
          - description: Total physical memory (resident set size) [Alpha]
            gauge:
              dataPoints:
                - asDouble: 1.79101696e+08
                  attributes:
                    - key: service_instance_id
                      value:
                        stringValue: 4932bd21-5048-41c7-8bc2-be72983842ad
                    - key: service_name
                      value:
                        stringValue: otelcontribcol
                    - key: service_version
                      value:
                        stringValue: 0.148.0-dev
                  timeUnixNano: "1000000"
            metadata:
              - key: prometheus.type
                value:
                  stringValue: gauge
            name: otelcol_process_memory_rss
          - description: Bytes of allocated heap objects (see 'go doc runtime.MemStats.HeapAlloc') [Alpha]
            gauge:
              dataPoints:
                - asDouble: 2.339104e+07
                  attributes:
                    - key: service_instance_id
                      value:
                        stringValue: 4932bd21-5048-41c7-8bc2-be72983842ad
                    - key: service_name
                      value:
                        stringValue: otelcontribcol
                    - key: service_version
                      value:
                        stringValue: 0.148.0-dev
                  timeUnixNano: "1000000"
            metadata:
              - key: prometheus.type
                value:
                  stringValue: gauge
            name: otelcol_process_runtime_heap_alloc_bytes
          - description: Cumulative bytes allocated for heap objects (see 'go doc runtime.MemStats.TotalAlloc') [Alpha]
            metadata:
              - key: prometheus.type
                value:
                  stringValue: counter
            name: otelcol_process_runtime_total_alloc_bytes
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asDouble: 3.5419576e+07
                  attributes:
                    - key: service_instance_id
                      value:
                        stringValue: 4932bd21-5048-41c7-8bc2-be72983842ad
                    - key: service_name
                      value:
                        stringValue: otelcontribcol
                    - key: service_version
                      value:
                        stringValue: 0.148.0-dev
                  timeUnixNano: "1000000"
              isMonotonic: true
          - description: Total bytes of memory obtained from the OS (see 'go doc runtime.MemStats.Sys') [Alpha]
            gauge:
              dataPoints:
                - asDouble: 4.1310472e+07
                  attributes:
                    - key: service_instance_id
                      value:
                        stringValue: 4932bd21-5048-41c7-8bc2-be72983842ad
                    - key: service_name
                      value:
                        stringValue: otelcontribcol
                    - key: service_version
                      value:
                        stringValue: 0.148.0-dev
                  timeUnixNano: "1000000"
            metadata:
              - key: prometheus.type
                value:
                  stringValue: gauge
            name: otelcol_process_runtime_total_sys_memory_bytes
          - description: Total number of internal errors encountered by the promhttp metric handler.
            metadata:
              - key: prometheus.type
                value:
                  stringValue: counter
            name: promhttp_metric_handler_errors_total
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asDouble: 0
                  attributes:
                    - key: cause
                      value:
                        stringValue: encoding
                  timeUnixNano: "1000000"
                - asDouble: 0
                  attributes:
                    - key: cause
                      value:
                        stringValue: gathering
                  timeUnixNano: "1000000"
              isMonotonic: true
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver
          version: 0.148.0-dev
